<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08090c" />
    <script>(function(){var d=document.documentElement,t;try{var q=new URLSearchParams(location.search).get('theme');if(q==='light'||q==='dark'){localStorage.setItem('pf-theme',q);t=q}else t=localStorage.getItem('pf-theme')}catch(e){}d.dataset.theme=t==='light'?'light':'dark';if(t==='light')document.querySelector('meta[name=theme-color]').content='#e9edf2'})()</script>
    <meta name="description" content="Prompt Studio — build, preview and save structured prompts." />
    <title>Prompt Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
